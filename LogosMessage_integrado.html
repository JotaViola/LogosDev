<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LogosDev • Chat</title>

    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: #18191d;
            color: #f4f4f5;
            overflow: hidden;
        }

        button,
        input,
        textarea,
        select {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        ::selection {
            background: rgba(202, 178, 115, 0.3);
        }

        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #3b3d43;
            border-radius: 20px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4b4e55;
        }


        /* =========================================================
           VARIÁVEIS
        ========================================================= */

        :root {

            --gold: #cab273;
            --gold-light: #d9c48e;
            --gold-dark: #917847;

            --sidebar: #151619;
            --sidebar-header: #121316;
            --sidebar-hover: #24262b;
            --sidebar-active: #32343a;

            --main: #1b1c20;
            --main-light: #202126;
            --main-lighter: #25272c;

            --input: #222429;

            --border: #303238;
            --border-light: #3b3d44;

            --text: #f1f1f2;
            --text-soft: #c5c7cc;
            --text-muted: #858891;

            --green: #42c985;
            --red: #e56767;
            --blue: #67a9e8;

            --sidebar-width: 285px;
            --header-height: 68px;
        }


        /* =========================================================
           APP
        ========================================================= */

        .app {
            width: 100%;
            height: 100vh;

            display: flex;

            background: var(--main);

            overflow: hidden;
        }


        /* =========================================================
           SIDEBAR
        ========================================================= */

        .sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);

            height: 100vh;

            display: flex;
            flex-direction: column;

            background: var(--sidebar);

            border-right: 1px solid #292a2f;

            z-index: 100;

            transition:
                transform .25s ease;
        }


        /* Workspace */

        .workspace-header {
            height: var(--header-height);
            min-height: var(--header-height);

            padding: 0 17px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: var(--sidebar-header);

            border-bottom: 1px solid #292a2f;
        }

        .workspace-left {
            display: flex;
            align-items: center;

            gap: 11px;

            min-width: 0;
        }

        .workspace-logo {
            width: 38px;
            height: 38px;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    #d2b972,
                    #9b7e42
                );

            color: #171717;

            font-size: 13px;
            font-weight: 900;

            box-shadow:
                0 5px 16px
                rgba(202, 178, 115, .16);
        }

        .workspace-details {
            min-width: 0;
        }

        .workspace-name {
            font-size: 15px;
            font-weight: 800;

            color: #fff;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .workspace-subtitle {
            margin-top: 2px;

            font-size: 10px;

            color: #7d8088;
        }

        .workspace-menu {
            width: 31px;
            height: 31px;

            border: 0;
            border-radius: 7px;

            background: transparent;

            color: #85878f;

            font-size: 20px;

            transition: .15s;
        }

        .workspace-menu:hover {
            background: var(--sidebar-hover);
            color: white;
        }


        /* Sidebar content */

        .sidebar-content {
            flex: 1;

            overflow-y: auto;

            padding:
                16px 10px
                12px;
        }

        .sidebar-section {
            margin-bottom: 27px;
        }

        .section-title {
            height: 27px;

            padding:
                0 9px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            color: #92959e;

            font-size: 11px;
            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: .55px;
        }

        .section-title button {
            width: 25px;
            height: 25px;

            border: 0;
            border-radius: 6px;

            background: transparent;

            color: #9699a1;

            font-size: 17px;

            transition: .15s;
        }

        .section-title button:hover {
            background: var(--sidebar-hover);
            color: var(--gold-light);
        }


        /* Channels */

        .channel-list,
        .dm-list {
            display: flex;
            flex-direction: column;

            gap: 2px;
        }

        .channel-item,
        .dm-item {
            width: 100%;

            min-height: 37px;

            padding:
                6px 10px;

            display: flex;
            align-items: center;

            gap: 9px;

            border: 0;
            border-radius: 7px;

            background: transparent;

            color: #b0b2b9;

            text-align: left;

            transition:
                background .15s,
                color .15s;
        }

        .channel-item:hover,
        .dm-item:hover {
            background: var(--sidebar-hover);
            color: #fff;
        }

        .channel-item.active,
        .dm-item.active {
            background:
                linear-gradient(
                    90deg,
                    #35373d,
                    #303237
                );

            color: #fff;

            box-shadow:
                inset 3px 0 0 var(--gold);
        }

        .channel-symbol {
            width: 19px;

            color: #858891;

            text-align: center;

            font-size: 14px;
            font-weight: 700;
        }

        .channel-item.active .channel-symbol {
            color: var(--gold);
        }

        .channel-name,
        .dm-name {
            flex: 1;

            min-width: 0;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            font-size: 13px;
        }

        .private-symbol {
            font-size: 11px;
        }


        /* =========================================================
           AVATARES
        ========================================================= */

        .avatar {
            position: relative;

            width: 35px;
            height: 35px;

            min-width: 35px;

            border-radius: 9px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    #454850,
                    #292b31
                );

            color: white;

            font-size: 11px;
            font-weight: 800;

            border: 1px solid rgba(255,255,255,.04);
        }

        .avatar.small {
            width: 29px;
            height: 29px;

            min-width: 29px;

            border-radius: 7px;

            font-size: 9px;
        }

        .avatar.large {
            width: 44px;
            height: 44px;

            min-width: 44px;

            border-radius: 11px;

            font-size: 13px;
        }

        .online-dot {
            position: absolute;

            width: 9px;
            height: 9px;

            right: -1px;
            bottom: -1px;

            border-radius: 50%;

            background: var(--green);

            border:
                2px solid var(--sidebar);
        }


        /* =========================================================
           USER FOOTER
        ========================================================= */

        .user-footer {
            height: 70px;
            min-height: 70px;

            padding:
                10px 13px;

            display: flex;
            align-items: center;

            gap: 10px;

            background: #121316;

            border-top: 1px solid #292a2f;
        }

        .user-footer-info {
            flex: 1;

            min-width: 0;
        }

        .user-footer-name {
            font-size: 12px;
            font-weight: 800;

            color: white;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-status {
            margin-top: 3px;

            display: flex;
            align-items: center;

            gap: 4px;

            color: var(--green);

            font-size: 10px;
        }

        .settings-btn {
            width: 31px;
            height: 31px;

            border: 0;
            border-radius: 7px;

            background: transparent;

            color: #747780;

            font-size: 15px;
        }

        .settings-btn:hover {
            background: var(--sidebar-hover);
            color: white;
        }


        /* =========================================================
           MAIN
        ========================================================= */

        .main {
            flex: 1;

            min-width: 0;
            height: 100vh;

            display: flex;
            flex-direction: column;

            background: var(--main);
        }


        /* =========================================================
           TOPBAR
        ========================================================= */

        .topbar {
            height: var(--header-height);
            min-height: var(--header-height);

            padding:
                0 20px;

            display: flex;
            align-items: center;

            gap: 14px;

            background: #1b1c20;

            border-bottom:
                1px solid var(--border);
        }

        .mobile-menu {
            display: none;

            width: 35px;
            height: 35px;

            border: 0;
            border-radius: 7px;

            background: transparent;

            color: var(--text-soft);

            font-size: 19px;
        }

        .mobile-menu:hover {
            background: var(--main-lighter);
        }

        .channel-heading {
            flex: 1;

            min-width: 0;
        }

        .channel-title {
            display: flex;
            align-items: center;

            gap: 7px;

            font-size: 15px;
            font-weight: 800;
        }

        .channel-title-symbol {
            color: var(--gold);

            font-size: 17px;
        }

        .channel-topic {
            margin-top: 4px;

            color: var(--text-muted);

            font-size: 10px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        /* Top actions */

        .top-actions {
            display: flex;
            align-items: center;

            gap: 4px;
        }

        .search-wrapper {
            position: relative;
        }

        .search-icon {
            position: absolute;

            left: 11px;
            top: 50%;

            transform:
                translateY(-50%);

            color: #747780;

            pointer-events: none;

            font-size: 14px;
        }

        .search-input {
            width: 190px;
            height: 35px;

            padding:
                0 11px
                0 32px;

            border:
                1px solid var(--border);

            border-radius: 7px;

            outline: none;

            background: #24262b;

            color: white;

            font-size: 11px;

            transition: .2s;
        }

        .search-input::placeholder {
            color: #747780;
        }

        .search-input:focus {
            width: 245px;

            border-color:
                rgba(202,178,115,.55);

            box-shadow:
                0 0 0 3px
                rgba(202,178,115,.06);
        }

        .top-button {
            width: 35px;
            height: 35px;

            border: 0;
            border-radius: 7px;

            background: transparent;

            color: #9b9ea6;

            font-size: 15px;

            transition: .15s;
        }

        .top-button:hover {
            background: var(--main-lighter);
            color: white;
        }


        /* =========================================================
           CHAT
        ========================================================= */

        .messages {
            flex: 1;

            overflow-y: auto;

            /* Chat mais compacto, sem espaço exagerado no topo */
            padding:
                8px 30px
                16px;

            background:
                radial-gradient(
                    circle at 85% 0%,
                    rgba(202,178,115,.035),
                    transparent 30%
                ),
                var(--main);

            scroll-behavior: smooth;
        }


        /* Channel intro */

        .channel-intro {
            padding:
                3px 0
                27px;

            max-width: 850px;
        }

        .channel-intro-icon {
            width: 58px;
            height: 58px;

            margin-bottom: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background:
                linear-gradient(
                    145deg,
                    #303238,
                    #27292e
                );

            border:
                1px solid #3c3e45;

            color: var(--gold);

            font-size: 27px;

            box-shadow:
                0 7px 25px
                rgba(0,0,0,.15);
        }

        .channel-intro h1 {
            font-size: 24px;
            font-weight: 800;

            color: #fff;

            margin-bottom: 7px;
        }

        .channel-intro p {
            color: #9da0a8;

            font-size: 12px;

            line-height: 1.6;
        }


        /* Messages */

        .message {
            position: relative;

            display: flex;
            align-items: flex-start;

            gap: 10px;

            padding:
                3px 10px;

            margin:
                0 -10px;

            border-radius: 7px;

            transition:
                background .15s;
        }

        .message:hover {
            background:
                rgba(255,255,255,.027);
        }

        .message-content {
            flex: 1;

            min-width: 0;

            padding-right: 45px;
        }

        .message-header {
            display: flex;
            align-items: baseline;

            gap: 6px;

            margin-bottom: 1px;

            min-height: 16px;
        }

        .message-author {
            color: #fff;

            font-size: 13px;
            font-weight: 800;
        }

        .message-time {
            color: #6f727a;

            font-size: 9px;
        }

        .message-text {
            color: #d1d3d7;

            font-size: 13px;

            line-height: 1.45;

            white-space: pre-wrap;

            word-break: break-word;

            margin: 0;
        }

        .message-text a {
            color: #79ace0;

            text-decoration: none;
        }

        .message-text a:hover {
            text-decoration: underline;
        }

        .edited {
            color: #6f727a;

            font-size: 9px;
        }

        .pinned-indicator {
            display: inline-flex;
            align-items: center;

            gap: 3px;

            color: var(--gold);

            font-size: 9px;
        }


        /* Reply */

        .reply-preview {
            max-width: 700px;

            margin-bottom: 6px;

            padding:
                6px 9px;

            border-left:
                2px solid var(--gold-dark);

            border-radius:
                0 5px 5px 0;

            background: #222328;

            color: #94979f;

            font-size: 10px;
        }

        .reply-preview strong {
            color: #c9cbd0;
        }


        /* Message actions */

        .message-actions {
            position: absolute;

            right: 10px;
            top: -12px;

            display: flex;

            padding: 3px;

            gap: 2px;

            opacity: 0;

            pointer-events: none;

            background: #292b30;

            border:
                1px solid #41434a;

            border-radius: 7px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,.35);

            transition: opacity .15s;
        }

        .message:hover .message-actions {
            opacity: 1;

            pointer-events: auto;
        }

        .message-action {
            width: 29px;
            height: 27px;

            border: 0;
            border-radius: 5px;

            background: transparent;

            color: #b4b6bc;

            font-size: 12px;
        }

        .message-action:hover {
            background: #3a3c42;

            color: white;
        }

        .message-action.danger:hover {
            color: #ff7777;
        }


        /* Reactions */

        .reactions {
            display: flex;
            flex-wrap: wrap;

            gap: 4px;

            margin-top: 7px;
        }

        .reaction {
            height: 24px;

            padding:
                0 8px;

            border:
                1px solid #3a3c43;

            border-radius: 13px;

            background: #24262a;

            color: #c4c6cb;

            font-size: 11px;

            transition: .15s;
        }

        .reaction:hover {
            background: #302e27;

            border-color:
                var(--gold-dark);

            color: white;
        }


        /* =========================================================
           COMPOSER
        ========================================================= */

        .composer-area {
            position: relative;

            padding:
                9px 24px
                17px;

            background: var(--main);
        }

        .reply-bar {
            display: none;

            align-items: center;

            gap: 8px;

            padding:
                7px 10px;

            margin-bottom: 5px;

            border:
                1px solid var(--border);

            border-bottom: 0;

            border-radius:
                8px 8px 0 0;

            background: #222328;

            color: #9ea1a8;

            font-size: 10px;
        }

        .reply-bar.show {
            display: flex;
        }

        .reply-bar-content {
            flex: 1;

            min-width: 0;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .reply-bar strong {
            color: white;
        }

        .cancel-reply {
            width: 26px;
            height: 26px;

            border: 0;
            border-radius: 5px;

            background: transparent;

            color: #777a82;

            font-size: 17px;
        }

        .cancel-reply:hover {
            background: #34363b;
            color: white;
        }


        /* Composer */

        .composer {
            position: relative;

            min-height: 58px;

            display: flex;
            align-items: flex-end;

            gap: 6px;

            padding:
                7px;

            border:
                1px solid #393b42;

            border-radius: 9px;

            background:
                linear-gradient(
                    180deg,
                    #24262b,
                    #222429
                );

            box-shadow:
                0 6px 25px
                rgba(0,0,0,.10);

            transition: .2s;
        }

        .composer:focus-within {
            border-color:
                rgba(202,178,115,.55);

            box-shadow:
                0 0 0 3px
                rgba(202,178,115,.055);
        }

        .composer textarea {
            flex: 1;

            min-height: 40px;
            max-height: 150px;

            padding:
                10px 5px;

            resize: none;

            border: 0;
            outline: none;

            background: transparent;

            color: #f4f4f5;

            font-size: 12px;

            line-height: 1.45;
        }

        .composer textarea::placeholder {
            color: #777a82;
        }

        .composer-button {
            width: 38px;
            height: 38px;

            flex-shrink: 0;

            border: 0;
            border-radius: 7px;

            background: transparent;

            color: #898c94;

            font-size: 16px;
        }

        .composer-button:hover {
            background: #33353b;
            color: white;
        }

        .send-button {
            background:
                linear-gradient(
                    145deg,
                    var(--gold-light),
                    var(--gold)
                );

            color: #181818;

            font-size: 15px;

            font-weight: 900;
        }

        .send-button:hover {
            background:
                linear-gradient(
                    145deg,
                    #e3cc98,
                    #c9aa61
                );

            color: #111;
        }


        /* =========================================================
           EMOJI PICKER
        ========================================================= */

        .emoji-picker {
            position: absolute;

            left: 25px;
            bottom: 78px;

            width: 310px;

            padding:
                14px;

            display: none;

            background:
                #24262b;

            border:
                1px solid #44464d;

            border-radius: 10px;

            box-shadow:
                0 18px 45px
                rgba(0,0,0,.48);

            z-index: 500;
        }

        .emoji-picker.show {
            display: block;

            animation:
                emojiIn .15s ease;
        }

        @keyframes emojiIn {

            from {
                opacity: 0;
                transform:
                    translateY(7px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }
        }

        .emoji-picker-header {
            display: flex;
            justify-content: space-between;

            margin-bottom: 11px;

            color: #a4a6ad;

            font-size: 10px;
            font-weight: 800;
        }

        .emoji-grid {
            display: grid;

            grid-template-columns:
                repeat(8, 1fr);

            gap: 3px;
        }

        .emoji-item {
            width: 31px;
            height: 31px;

            border: 0;
            border-radius: 6px;

            background: transparent;

            font-size: 19px;
        }

        .emoji-item:hover {
            background: #35373d;
        }


        /* =========================================================
           MODAL
        ========================================================= */

        .modal-overlay {
            position: fixed;

            inset: 0;

            display: none;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                rgba(0,0,0,.72);

            backdrop-filter:
                blur(4px);

            z-index: 2000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: min(530px, 100%);

            max-height: 90vh;

            overflow-y: auto;

            background: #23252a;

            border:
                1px solid #42444b;

            border-radius: 12px;

            box-shadow:
                0 25px 80px
                rgba(0,0,0,.6);

            animation:
                modalIn .18s ease;
        }

        @keyframes modalIn {

            from {
                opacity: 0;
                transform:
                    translateY(10px)
                    scale(.98);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }

        .modal-header {
            min-height: 57px;

            padding:
                0 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom:
                1px solid #36383f;
        }

        .modal-header h2 {
            font-size: 16px;
        }

        .modal-close {
            width: 31px;
            height: 31px;

            border: 0;
            border-radius: 7px;

            background: transparent;

            color: #858891;

            font-size: 20px;
        }

        .modal-close:hover {
            background: #34363a;
            color: white;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-footer {
            padding:
                13px 18px;

            display: flex;
            justify-content: flex-end;

            gap: 7px;

            border-top:
                1px solid #36383f;
        }


        /* Forms */

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;

            margin-bottom: 6px;

            color: #c5c7cc;

            font-size: 11px;
            font-weight: 700;
        }

        .form-input,
        .form-textarea,
        .form-select {
            width: 100%;

            padding:
                10px 11px;

            border:
                1px solid #3c3e45;

            border-radius: 7px;

            outline: none;

            background: #191a1e;

            color: white;

            font-size: 12px;

            transition: .15s;
        }

        .form-textarea {
            min-height: 95px;

            resize: vertical;
        }

        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            border-color:
                var(--gold-dark);

            box-shadow:
                0 0 0 2px

<script>

    /* =========================================================
       CONFIGURAÇÃO
    ========================================================= */

    const STORAGE_KEY =
        "logosdev_chat_data_v3";


    let state = {

        users: [],

        roles: [],

        channels: [],

        messages: {},

        directMessages: {},

        currentUserId: null,

        currentConversation: {

            type: "channel",

            id: "geral"

        }

    };


    let replyTo = null;

    let editingMessageId = null;


    /* =========================================================
       UTILIDADES
    ========================================================= */

    function generateId(prefix = "id") {

        return (
            prefix +
            "_" +
            Date.now().toString(36) +
            "_" +
            Math.random()
                .toString(36)
                .substring(2, 9)
        );
    }


    function escapeHtml(value) {

        if (
            value === undefined ||
            value === null
        ) {
            return "";
        }

        return String(value)

            .replace(/&/g, "&amp;")

            .replace(/</g, "&lt;")

            .replace(/>/g, "&gt;")

            .replace(/"/g, "&quot;")

            .replace(/'/g, "&#039;");
    }


    function initials(name) {

        if (!name) {
            return "?";
        }

        const parts =
            name.trim().split(/\s+/);

        if (parts.length === 1) {

            return parts[0]
                .substring(0, 2)
                .toUpperCase();
        }

        return (
            parts[0][0] +
            parts[parts.length - 1][0]
        ).toUpperCase();
    }


    function formatText(text) {

        /*
         * Limpa espaços/quebras de linha no início e no final
         * da mensagem. As quebras internas continuam preservadas.
         */
        const cleanText = String(text || "")
            .replace(/^\s+/, "")
            .replace(/\s+$/, "");

        let result =
            escapeHtml(cleanText);

        result =
            result.replace(
                /(https?:\/\/[^\s<]+)/g,
                '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
            );

        return result;
    }


    function formatTime(timestamp) {

        return new Date(timestamp)
            .toLocaleTimeString(
                "pt-BR",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );
    }


    function formatDate(timestamp) {

        return new Date(timestamp)
            .toLocaleDateString(
                "pt-BR",
                {
                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric"
                }
            );
    }


    function getUser(id) {

        return state.users.find(
            user => user.id === id
        );
    }


    function getCurrentUser() {

        return getUser(
            state.currentUserId
        );
    }


    function getRole(roleId) {
        return (state.roles || []).find(r => r.id === roleId);
    }


    function isOwner() {
        const user = getCurrentUser();
        // JV é o proprietário absoluto do workspace. O ID é a fonte de verdade
        // para evitar que dados antigos do localStorage bloqueiem o Owner.
        return !!user && (
            user.id === "joao" ||
            user.isOwner === true ||
            ["owner", "president"].includes(String(user.role || "").toLowerCase())
        );
    }


    function can(permission) {
        if (isOwner()) return true;
        const user = getCurrentUser();
        if (!user) return false;
        const role = getRole(user.role);
        return !!role?.permissions?.includes(permission);
    }


    function getChannel(id) {

        return state.channels.find(
            channel => channel.id === id
        );
    }


    function getDMKey(a, b) {

        return [a, b]
            .sort()
            .join("__");
    }


    function saveState() {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(state)
        );
    }

    function loadState() {

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );

        if (!saved) {

            state =
                createInitialState();

            saveState();

            return;
        }

        try {

            state =
                JSON.parse(saved);

        } catch (error) {

            state =
                createInitialState();

            saveState();
        }


        if (!state.users) {

            state.users =
                createInitialState().users;
        }

        if (!state.channels) {

            state.channels =
                createInitialState().channels;
        }

        if (!state.messages) {

            state.messages = {};
        }

        if (!state.directMessages) {

            state.directMessages = {};
        }

        if (!state.currentUserId) {

            state.currentUserId =
                "joao";
        }

        if (!state.currentConversation) {

            state.currentConversation = {

                type: "channel",

                id: "geral"

            };
        }

        // Sistema de roles e permissões: migra perfis antigos para IDs de role.
        const defaultRoles = createInitialState().roles;
        if (!Array.isArray(state.roles) || !state.roles.length) {
            state.roles = defaultRoles.map(r => ({ ...r, permissions: [...r.permissions] }));
        } else {
            // Mantém somente os cargos oficiais e preserva eventuais ajustes de
            // permissões feitos pelo Owner nesses cargos.
            state.roles = defaultRoles.map(dr => {
                const existing = state.roles.find(r => r.id === dr.id);
                return existing
                    ? { ...dr, ...existing, name: dr.name, description: dr.description, permissions: Array.isArray(existing.permissions) ? existing.permissions : [...dr.permissions] }
                    : { ...dr, permissions: [...dr.permissions] };
            });
        }

        const legacyRoleMap = {
            "Owner": "president",
            "owner": "president",
            "President": "president",
            "president": "president",
            "Admin": "vice_president",
            "admin": "vice_president",
            "Vice President": "vice_president",
            "vice_president": "vice_president",
            "Head of Sales": "head_sales",
            "head_sales": "head_sales",
            "Head of Marketing": "sales",
            "Head of Support": "head_support",
            "head_support": "head_support",
            "Head of Developer": "head_developer",
            "Developer Senior": "developer",
            "Desenvolvedor": "developer",
            "developer": "developer",
            "Support": "support",
            "support": "support",
            "Sales": "sales",
            "sales": "sales",
            "Membro": "developer",
            "member": "developer",
            "Guest": "support",
            "Convidado": "support",
            "guest": "support"
        };

        state.users = (state.users || []).map(u => {
            if (legacyRoleMap[u.role]) u.role = legacyRoleMap[u.role];
            if (!getRole(u.role)) u.role = "member";
            return u;
        });

        // O usuário JV é o Owner do workspace e sempre possui acesso total.
        const ownerUser = state.users.find(u => u.id === "joao");
        if (ownerUser) {
            ownerUser.role = "president";
            ownerUser.isOwner = true;
        } else {
            // Nunca deixa o workspace sem o Owner original.
            state.users.unshift({
                id: "joao",
                name: "JV",
                role: "president",
                isOwner: true,
                online: true
            });
        }

        // Garante que todos os canais antigos tenham uma lista de membros.
        // Públicos: toda a equipe. Privados: mantêm os membros existentes;
        // se não houver registro, somente o Owner entra inicialmente.
        (state.channels || []).forEach(channel => ensureChannelMembers(channel));

        saveState();

        saveState();
    }

    /* =========================================================
       ABRIR CANAL
    ========================================================= */

    function openChannel(channelId) {
        const channel = getChannel(channelId);
        if (!channel) return;

        ensureChannelMembers(channel);
        const isMember = channel.members.includes(state.currentUserId);
        if (channel.private && !isMember && !isOwner()) {
            showToast("Você não faz parte deste canal.");
            return;
        }

        state.currentConversation = { type: "channel", id: channelId };
        document.getElementById("searchInput").value = "";
        saveState();
        renderSidebar();
        renderConversation();
        closeSidebarMobile();
    }


    /* =========================================================
       DIRECT MESSAGE
    ========================================================= */

    function openDirectMessage(userId) {

        const user =
            getUser(userId);

        if (!user) return;


        state.currentConversation = {

            type: "dm",

            id: userId

        };


        const key =
            getDMKey(
                state.currentUserId,
                userId
            );


        if (!state.directMessages[key]) {

            state.directMessages[key] =
                [];
        }


        saveState();

        renderSidebar();

        renderConversation();

        closeSidebarMobile();
    }


    /* =========================================================
       RENDER CONVERSA
    ========================================================= */

    function renderConversation() {

        const icon =
            document.getElementById(
                "channelIcon"
            );

        const name =
            document.getElementById(
                "channelName"
            );

        const topic =
            document.getElementById(
                "channelTopic"
            );


        if (
            state.currentConversation.type ===
            "channel"
        ) {

            const channel =
                getChannel(
                    state.currentConversation.id
                );

            if (!channel) return;


            icon.textContent =
                channel.private
                    ? "🔒"
                    : "#";

            icon.style.color =
                channel.private
                    ? "#aaa"
                    : "var(--gold)";


            name.textContent =
                channel.name;


            topic.textContent =
                channel.topic ||
                "Sem descrição";

        } else {

            const user =
                getUser(
                    state.currentConversation.id
                );

            if (!user) return;


            icon.textContent =
                "●";

            icon.style.color =
                user.online
                    ? "var(--green)"
                    : "var(--text-muted)";


            name.textContent =
                user.name;


            topic.textContent =
                user.online
                    ? "Disponível"
                    : "Offline";
        }


        renderMessages();
    }


    /* =========================================================
       GET MESSAGES
    ========================================================= */

    function getCurrentMessages() {

        if (
            state.currentConversation.type ===
            "channel"
        ) {

            const id =
                state.currentConversation.id;


            if (!state.messages[id]) {

                state.messages[id] = [];
            }


            return state.messages[id];
        }


        const key =
            getDMKey(
                state.currentUserId,
                state.currentConversation.id
            );


        if (!state.directMessages[key]) {

            state.directMessages[key] =
                [];
        }


        return state.directMessages[key];
    }


    /* =========================================================
       RENDER MESSAGES
    ========================================================= */

    function renderMessages() {

        const container =
            document.getElementById(
                "messages"
            );


        const messages =
            getCurrentMessages();


        const search =
            document.getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();


        let filtered =
            messages;


        if (search) {

            filtered =
                messages.filter(
                    message =>
                        message.text
                            .toLowerCase()
                            .includes(search)
                );
        }


        container.innerHTML = "";


        if (
            !search &&
            state.currentConversation.type ===
                "channel"
        ) {

            const channel =
                getChannel(
                    state.currentConversation.id
                );


            container.innerHTML = `

                <div class="channel-intro">

                    <div class="channel-intro-icon">

                        ${
                            channel.private
                                ? "🔒"
                                : "#"
                        }

                    </div>

                    <h1>

                        ${
                            channel.private
                                ? "Canal privado"
                                : "#" +
                                  escapeHtml(
                                      channel.name
                                  )
                        }

                    </h1>

                    <p>

                        ${escapeHtml(
                            channel.topic ||
                            ""
                        )}

                    </p>

                </div>

            `;
        }


        if (filtered.length === 0) {

            container.innerHTML += `

                <div class="empty-state">

                    <div class="empty-icon">
                        ${
                            search
                                ? "⌕"
                                : "💬"
                        }
                    </div>

                    <h3>

                        ${
                            search
                                ? "Nenhuma mensagem encontrada"
                                : "Nenhuma mensagem ainda"
                        }

                    </h3>

                    <p>

                        ${
                            search
                                ? "Tente pesquisar por outro termo."
                                : "Envie a primeira mensagem."
                        }

                    </p>

                </div>

            `;

            return;
        }


        filtered.forEach(
            message => {

                container.innerHTML +=
                    renderMessage(message);

            }
        );


        requestAnimationFrame(
            () => {

                container.scrollTop =
                    container.scrollHeight;

            }
        );
    }


    /* =========================================================
       MESSAGE HTML
    ========================================================= */

    function renderMessage(message) {

        const user =
            getUser(message.userId);

        if (!user) return "";


        let replyHtml = "";


        if (message.replyTo) {

            const parent =
                getCurrentMessages().find(
                    item =>
                        item.id ===
                        message.replyTo
                );


            if (parent) {

                const parentUser =
                    getUser(parent.userId);


                replyHtml = `

                    <div class="reply-preview">

                        Respondendo a

                        <strong>
                            ${escapeHtml(
                                parentUser?.name ||
                                "Usuário"
                            )}
                        </strong>

                        :

                        ${escapeHtml(
                            parent.text
                                .substring(
                                    0,
                                    100
                                )
                        )}

                    </div>

                `;
            }
        }


        let reactionsHtml = "";


        if (
            message.reactions &&
            message.reactions.length
        ) {

            reactionsHtml = `

                <div class="reactions">

                    ${
                        message.reactions
                            .map(
                                reaction => `

                                    <button
                                        class="reaction"
                                        onclick="toggleReaction(
                                            '${message.id}',
                                            '${reaction.emoji}'
                                        )"
                                    >

                                        ${reaction.emoji}

                                        ${reaction.users.length}

                                    </button>

                                `
                            )
                            .join("")
                    }

                </div>

            `;
        }


        return `

            <article
                class="message"
                data-message-id="${message.id}"
            >

                <div class="avatar">

                    ${initials(
                        user.name
                    )}

                    ${
                        user.online
                            ? '<span class="online-dot"></span>'
                            : ""
                    }

                </div>


                <div class="message-content">

                    <div class="message-header">

                        <span class="message-author">

                            ${escapeHtml(
                                user.name
                            )}

                        </span>

                        <span class="message-time">

                            ${formatTime(
                                message.timestamp
                            )}

                        </span>

                        ${
                            message.edited
                                ? '<span class="edited">(editado)</span>'
                                : ""
                        }

                        ${
                            message.pinned
                                ? `
                                    <span class="pinned-indicator">
                                        📌
                                        fixada
                                    </span>
                                `
                                : ""
                        }

                    </div>


                    ${replyHtml}


                    <div class="message-text">${formatText(
                        message.text
                    )}</div>


                    ${reactionsHtml}

                </div>


                <div class="message-actions">

                    <button
                        class="message-action"
                        onclick="replyToMessage('${message.id}')"
                        title="Responder"
                    >
                        ↩
                    </button>

                    <button
                        class="message-action"
                        onclick="quickReaction('${message.id}')"
                        title="Reagir"
                    >
                        😊
                    </button>

                    <button
                        class="message-action"
                        onclick="togglePin('${message.id}')"
                        title="${
                            message.pinned
                                ? "Desafixar"
                                : "Fixar"
                        }"
                    >
                        📌
                    </button>


                    ${
                        (message.userId === state.currentUserId || can("delete_messages"))

                            ? `

                                <button
                                    class="message-action"
                                    onclick="editMessage('${message.id}')"
                                    title="Editar"
                                >
                                    ✎
                                </button>

                                <button
                                    class="message-action danger"
                                    onclick="deleteMessage('${message.id}')"
                                    title="Excluir"
                                >
                                    🗑
                                </button>

                              `

                            : ""
                    }

                </div>

            </article>

        `;
    }


    /* =========================================================
       SEND MESSAGE
    ========================================================= */

    function sendMessage() {

        const input =
            document.getElementById(
                "messageInput"
            );


        const text =
            input.value.trim();


        if (!text) return;


        const messages =
            getCurrentMessages();


        if (editingMessageId) {

            const message =
                messages.find(
                    item =>
                        item.id ===
                        editingMessageId
                );


            if (message) {

                message.text =
                    text;

                message.edited =
                    true;

                showToast(
                    "Mensagem editada."
                );
            }


            editingMessageId =
                null;

        } else {

            messages.push({

                id:
                    generateId("msg"),

                userId:
                    state.currentUserId,

                text:

                    text,

                timestamp:
                    Date.now(),

                reactions: [],

                pinned: false,

                edited: false,

                replyTo:

                    replyTo
                        ? replyTo.id
                        : null

            });


            if (replyTo) {

                cancelReply();
            }


            showToast(
                "Mensagem enviada."
            );
        }


        input.value = "";

        autoResize(input);

        saveState();

        renderMessages();

        input.focus();
    }


    /* =========================================================
       KEYBOARD
    ========================================================= */

    function handleMessageKey(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }


    function autoResize(textarea) {

        textarea.style.height =
            "auto";


        textarea.style.height =
            Math.min(
                textarea.scrollHeight,
                150
            ) + "px";
    }


    /* =========================================================
       REPLY
    ========================================================= */

    function replyToMessage(messageId) {

        const message =
            getCurrentMessages().find(
                item =>
                    item.id ===
                    messageId
            );


        if (!message) return;


        const user =
            getUser(message.userId);


        replyTo =
            message;


        document.getElementById(
            "replyAuthor"
        ).textContent =
            user?.name ||
            "Usuário";


        document.getElementById(
            "replyText"
        ).textContent =
            " — " +
            message.text.substring(
                0,
                80
            );


        document.getElementById(
            "replyBar"
        ).classList.add(
            "show"
        );


        document.getElementById(
            "messageInput"
        ).focus();
    }


    function cancelReply() {

        replyTo =
            null;


        document.getElementById(
            "replyBar"
        ).classList.remove(
            "show"
        );
    }


    /* =========================================================
       EDIT MESSAGE
    ========================================================= */

    function editMessage(messageId) {

        const message =
            getCurrentMessages().find(
                item =>
                    item.id ===
                    messageId
            );


        if (!message) return;


        editingMessageId =
            messageId;


        const input =
            document.getElementById(
                "messageInput"
            );


        input.value =
            message.text;


        input.focus();


        autoResize(input);


        showToast(
            "Edite a mensagem e pressione Enter para salvar."
        );
    }


    /* =========================================================
       DELETE
    ========================================================= */

    function deleteMessage(messageId) {

        const messages =
            getCurrentMessages();

        const message = messages.find(item => item.id === messageId);
        if (!message) return;
        if (message.userId !== state.currentUserId && !can("delete_messages")) {
            showToast("Você não tem permissão para excluir esta mensagem.");
            return;
        }


        const index =
            messages.findIndex(
                item =>
                    item.id ===
                    messageId
            );


        if (index === -1) return;


        if (
            !confirm(
                "Tem certeza que deseja excluir esta mensagem?"
            )
        ) {
            return;
        }


        messages.splice(
            index,
            1
        );


        saveState();

        renderMessages();

        showToast(
            "Mensagem excluída."
        );
    }

    /* =========================================================
       REACTIONS
    ========================================================= */

    function toggleReaction(
        messageId,
        emoji
    ) {

        const message =
            getCurrentMessages().find(
                item =>
                    item.id ===
                    messageId
            );


        if (!message) return;


        if (!message.reactions) {

            message.reactions =
                [];
        }


        let reaction =
            message.reactions.find(
                item =>
                    item.emoji ===
                    emoji
            );


        if (!reaction) {

            reaction = {

                emoji,

                users: []

            };


            message.reactions.push(
                reaction
            );
        }


        const index =
            reaction.users.indexOf(
                state.currentUserId
            );


        if (index === -1) {

            reaction.users.push(
                state.currentUserId
            );

        } else {

            reaction.users.splice(
                index,
                1
            );
        }


        if (
            reaction.users.length ===
            0
        ) {

            message.reactions =
                message.reactions.filter(
                    item =>
                        item !==
                        reaction
                );
        }


        saveState();

        renderMessages();
    }


    function quickReaction(messageId) {

        const emojis = [

            "👍",
            "❤️",

        ];


        const emoji =
            emojis[
                Math.floor(

        toggleReaction(
            messageId,
            emoji
        );
    }

    function createChannel() {

        const name =
            document
                .getElementById(
                    "newChannelName"
                )
                .value
                .trim();


        const topic =
            document
                .getElementById(
                    "newChannelTopic"
                )
                .value
                .trim();


        const privateChannel =
            document
                .getElementById(
                    "newChannelPrivate"
                )
                .value ===
                "true";


        if (!name) {

            showToast(
                "Digite o nome do canal."
            );

            return;
        }


        const normalized =
            name
                .toLowerCase()
                .replace(/\s+/g, "-")
                .replace(
                    /[^a-z0-9-_]/g,
                    ""
                );


        if (!normalized) {

            showToast(
                "Nome de canal inválido."
            );

            return;
        }


        if (
            state.channels.some(
                channel =>
                    channel.name ===
                    normalized
            )
        ) {

            showToast(
                "Este canal já existe."
            );

            return;
        }


        const channel = {
            id: normalized,
            name: normalized,
            topic: topic || "Novo canal da equipe",
            private: privateChannel,
            // Canais públicos começam com toda a equipe; privados começam
            // somente com o criador. O Owner pode alterar depois.
            members: privateChannel
                ? [state.currentUserId]
                : state.users.map(u => u.id)
        };


        state.channels.push(
            channel
        );


        state.messages[
            channel.id
        ] = [];


        saveState();

        closeModal();

        renderSidebar();

        openChannel(
            channel.id
        );


        showToast(
            `Canal #${normalized} criado.`
        );
    }

    /* =========================================================
       CHANNEL MEMBERS
    ========================================================= */

    function ensureChannelMembers(channel) {
        if (!channel) return;
        if (!Array.isArray(channel.members)) {
            channel.members = channel.private
                ? ["joao"]
                : state.users.map(u => u.id);
        }
        // Remove IDs de usuários que já não existem.
        channel.members = channel.members.filter(id => state.users.some(u => u.id === id));
        if (channel.private && channel.members.length === 0) channel.members = ["joao"];
    }

    function canManageChannelMembers(channel) {
        return isOwner() || can("manage_channels") || can("manage_members");
    }

    function openChannelMembersModal() {
        const channel = getChannel(state.currentConversation?.id);
        if (!channel) return;
        ensureChannelMembers(channel);

        const canManage = canManageChannelMembers(channel);
        const members = state.users.filter(u => channel.members.includes(u.id));
        const available = state.users.filter(u => !channel.members.includes(u.id));

        openModal(
            `Membros de #${escapeHtml(channel.name)}`,
            `
                ${canManage ? `
                <div class="channel-member-add">
                    <select id="channelMemberSelect" class="input">
                        <option value="">Selecione um funcionário...</option>
                        ${available.map(user => `<option value="${user.id}">${escapeHtml(user.name)} — ${escapeHtml(getRole(user.role)?.name || user.role || "Membro")}</option>`).join("")}
                    </select>
                    <button class="btn primary" onclick="addChannelMember()">＋ Adicionar</button>
                </div>` : ""}
                <div class="channel-member-list">
                    ${members.length ? members.map(user => `
                        <div class="channel-member-row">
                            <div class="channel-member-main">
                                <div class="avatar">${user.avatar || initials(user.name)}${user.online ? '<span class="online-dot"></span>' : ''}</div>
                                <div class="member-info">
                                    <div class="member-name">${escapeHtml(user.name)} ${user.id === state.currentUserId ? '<small>(você)</small>' : ''}</div>
                                    <div class="member-role">${escapeHtml(getRole(user.role)?.name || user.role || 'Membro')}</div>
                                </div>
                            </div>
                            ${canManage && user.id !== "joao" ? `<div class="channel-member-actions"><button class="btn danger" onclick="removeChannelMember('${user.id}')">Remover</button></div>` : (canManage && user.id === "joao" && isOwner() ? `<div class="channel-member-actions"><span class="channel-member-owner">👑 Owner</span></div>` : "")}
                        </div>
                    `).join("") : '<div class="empty-state">Nenhum membro neste canal.</div>'}
                </div>
            `,
            `<button class="btn" onclick="closeModal()">Fechar</button>`
        );
    }

    function addChannelMember() {
        const channel = getChannel(state.currentConversation?.id);
        if (!channel || !canManageChannelMembers(channel)) return showToast("Sem permissão para gerenciar membros do canal.");
        const select = document.getElementById("channelMemberSelect");
        const userId = select?.value;
        if (!userId) return showToast("Selecione um funcionário.");
        ensureChannelMembers(channel);
        if (!channel.members.includes(userId)) channel.members.push(userId);
        saveState();
        showToast(`${getUser(userId)?.name || "Funcionário"} foi adicionado ao canal.`);
        openChannelMembersModal();
    }

    function removeChannelMember(userId) {
        const channel = getChannel(state.currentConversation?.id);
        if (!channel || !canManageChannelMembers(channel)) return showToast("Sem permissão para gerenciar membros do canal.");
        if (userId === "joao") return showToast("O Owner não pode ser removido do canal.");
        ensureChannelMembers(channel);
        const user = getUser(userId);
        if (!channel.members.includes(userId)) return;
        if (!confirm(`Remover ${user?.name || "este funcionário"} do canal #${channel.name}?`)) return;
        channel.members = channel.members.filter(id => id !== userId);
        saveState();
        showToast(`${user?.name || "Funcionário"} foi removido do canal.`);
        openChannelMembersModal();
    }

    function saveMember(e,id) {
        e.preventDefault();
        if (!isOwner() && !can("manage_members")) {
            showToast("Você não tem permissão para gerenciar membros.");
            return;
        }

        const name = document.getElementById("memberName").value.trim();
        const email = document.getElementById("memberEmail").value.trim();
        const role = document.getElementById("memberRole").value;
        const avatar = document.getElementById("memberAvatar").value.trim();
        if (!name) return;

        const target = id ? getUser(id) : null;

        // Somente o Owner pode conceder ou editar o Owner.
        if (role === "president" && !isOwner()) {
            showToast("Somente o President pode atribuir o cargo President.");
            return;
        }
        if (target && (target.id === "joao" || target.role === "president") && !isOwner()) {
            showToast("O Owner não pode ser alterado por outro usuário.");
            return;
        }

        if (target) {
            target.name = name;
            target.email = email;
            target.role = role;
            target.avatar = avatar;
            if (role === "president") target.isOwner = true;
            showToast("Membro atualizado.");
        } else {
            const newUserId = generateId("user");
            state.users.push({
                id: newUserId,
                name, email, role, avatar, online: true
            });

            // Todo funcionário novo entra automaticamente nos canais públicos.
            // Canais privados continuam exigindo convite explícito.
            (state.channels || []).forEach(channel => {
                ensureChannelMembers(channel);
                if (!channel.private && !channel.members.includes(newUserId)) {
                    channel.members.push(newUserId);
                }
            });
            showToast("Funcionário cadastrado com sucesso.");
        }

        saveState();
        renderSidebar();
        openMembersModal("members");
    }

    function removeMember(id) {
        if (!isOwner() && !can("manage_members")) return showToast("Sem permissão para remover membros.");
        const target = getUser(id);
        if (!target) return;
        if (target.id === state.currentUserId) return showToast("Você não pode excluir seu próprio usuário.");
        if (target.role === "president" && !isOwner()) return showToast("Somente o President/Owner pode remover o President.");
        if (!confirm(`Excluir ${target.name} do workspace?`)) return;
        state.users = state.users.filter(u => u.id !== id);
        (state.channels || []).forEach(channel => {
            if (Array.isArray(channel.members)) {
                channel.members = channel.members.filter(memberId => memberId !== id);
            }
        });
        saveState();
        renderSidebar();
        openMembersModal("members");
        showToast("Funcionário removido.");
    }

    function removeRole(id){

                        margin-top:15px;
                        padding:12px;
                        border:1px solid #383a41;
                        border-radius:8px;
                        background:#1b1c20;
                    ">

                        <strong style="color:white;">
                            Armazenamento
                        </strong>

                        <div style="
                            margin-top:4px;
                            color:#42c985;
                        ">
                            ● localStorage
                        </div>

                    </div>

                </div>

            `,

            `

                <button
                    class="btn"
                    onclick="closeModal()"
                >
                    Fechar
                </button>

                <button
                    class="btn danger"
                    onclick="resetChatData()"
                >
                    Restaurar dados
                </button>

            `
        );
    }


    function resetChatData() {

        if (
            !confirm(
                "Isso apagará os canais e mensagens criados localmente. Deseja continuar?"
            )
        ) {
            return;
        }


        localStorage.removeItem(
            STORAGE_KEY
        );


        state =
            createInitialState();


        saveState();

        closeModal();

        renderSidebar();

        renderConversation();


        showToast(
            "Dados restaurados."
        );
    }


    /* =========================================================
       MODAL
    ========================================================= */

    function openModal(
        title,
        body,
        footer = ""
    ) {

        document.getElementById(
            "modalTitle"
        ).textContent =
            title;


        document.getElementById(
            "modalBody"
        ).innerHTML =
            body;


        document.getElementById(
            "modalFooter"
        ).innerHTML =
            footer;


        document.getElementById(
            "modalOverlay"
        ).classList.add(
            "show"
        );
    }


    function closeModal() {

        document.getElementById(
            "modalOverlay"
        ).classList.remove(
            "show"
        );
    }


    function closeModalOnOverlay(event) {

        if (
            event.target ===
            document.getElementById(
                "modalOverlay"
            )
        ) {

            closeModal();
        }
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    function toggleSidebar() {

        document
            .getElementById(
                "sidebar"
            )
            .classList.toggle(
                "open"
            );
    }


    function closeSidebarMobile() {

        document
            .getElementById(
                "sidebar"
            )
            .classList.remove(
                "open"
            );
    }


    /* =========================================================
       TOAST
    ========================================================= */

    function showToast(message) {

        const container =
            document.getElementById(
                "toastContainer"
            );


        const toast =
            document.createElement(
                "div"
            );


        toast.className =
            "toast";


        toast.textContent =
            message;


        container.appendChild(
            toast
        );


        setTimeout(
            () => {

                toast.style.opacity =
                    "0";

                toast.style.transform =
                    "translateX(15px)";


                setTimeout(
                    () => {

                        toast.remove();

                    },
                    200
                );

            },
            2500
        );
    }


    /* =========================================================
       CLOSE EMOJI WHEN CLICKING OUTSIDE
    ========================================================= */

    document.addEventListener(
        "click",
        event => {

            const picker =
                document.getElementById(
                    "emojiPicker"
                );


            const composerButton =
                event.target.closest(
                    ".composer-button"
                );


            if (
                picker &&
                !picker.contains(
                    event.target
                ) &&
                !composerButton
            ) {

                picker.classList.remove(
                    "show"
                );
            }
        }
    );


    /* =========================================================
       ESC
    ========================================================= */

    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Escape"
            ) {

                closeModal();


                document
                    .getElementById(
                        "emojiPicker"
                    )
                    ?.classList.remove(
                        "show"
                    );
            }
        }
    );


    /* =========================================================
       INTEGRAÇÃO COM SOLICITAÇÕES DO SITE
    ========================================================= */

    const PROJECT_NOTIFICATION_KEY = "logosdev_project_notifications";

    function syncProjectsFromSite() {
        let incoming = [];

        try {
            incoming = JSON.parse(
                localStorage.getItem(PROJECT_NOTIFICATION_KEY) || "[]"
            );
        } catch (error) {
            incoming = [];
        }

        if (!Array.isArray(incoming) || !incoming.length) {
            return false;
        }

        let changed = false;

        incoming.forEach(project => {
            if (!project || !project.id) return;

            const destino = String(project.destinoCanal || "vendas").toLowerCase();
            const isDevelopment = destino === "desenvolvimento";
            const targetId = isDevelopment ? "desenvolvimento" : "projetos";
            const targetName = isDevelopment ? "desenvolvimento" : "vendas";
            const targetTopic = isDevelopment ? "Desenvolvimento e programação" : "Vendas em andamento";

            let channel = state.channels.find(channel => channel.id === targetId);

            if (!channel) {
                channel = {
                    id: targetId,
                    name: targetName,
                    topic: targetTopic,
                    private: true,
                    members: [state.currentUserId || "joao"]
                };
                state.channels.push(channel);
            }

            if (!state.messages[channel.id]) {
                state.messages[channel.id] = [];
            }

            const alreadyExists = state.messages[channel.id].some(
                message => message.projectId === project.id
            );

            if (alreadyExists) return;

            const prazo = project.prazo
                ? new Date(project.prazo + "T00:00:00").toLocaleDateString("pt-BR")
                : "Não informado";

            const text = isDevelopment
                ? "🚀 PROJETO ENCAMINHADO PARA DESENVOLVIMENTO\n\n" +
                  "🆔 " + project.id + "\n" +
                  "👤 Cliente: " + (project.cliente || "Não informado") + "\n" +
                  "🏢 Empresa: " + (project.empresa || "Não informado") + "\n" +
                  "📁 Projeto: " + (project.nome || project.tipoProjeto || "Não informado") + "\n" +
                  "📅 Prazo: " + prazo + "\n\n" +
                  "📝 Descrição:\n" + (project.descricao || "Não informado") + "\n\n" +
                  "🔵 Status: Não Iniciado"
                : "🚨 NOVA SOLICITAÇÃO DE PROJETO\n\n" +
                  "🆔 " + project.id + "\n" +
                  "👤 Cliente: " + (project.cliente || "Não informado") + "\n" +
                  "🏢 Empresa: " + (project.empresa || "Não informado") + "\n" +
                  "📁 Projeto: " + (project.nome || project.tipoProjeto || "Não informado") + "\n" +
                  "📅 Prazo: " + prazo + "\n\n" +
                  "📝 Descrição:\n" + (project.descricao || "Não informado") + "\n\n" +
                  "🟡 Status: Projeto Solicitado";

            state.messages[channel.id].push({
                id: generateId("msg_project"),
                userId: "joao",
                text,
                timestamp: project.timestamp || Date.now(),
                reactions: [],
                pinned: false,
                edited: false,
                replyTo: null,
                projectId: project.id,
                systemGenerated: true
            });

            changed = true;
        });

        if (changed) {
            saveState();
        }

        localStorage.removeItem(PROJECT_NOTIFICATION_KEY);

        return changed;
    }

    /* =========================================================
       INITIALIZATION
    ========================================================= */

    function init() {

        loadState();

        syncProjectsFromSite();

        renderSidebar();

        renderConversation();


        const input =
            document.getElementById(
                "messageInput"
            );


        input.focus();
    }


    // Se o LogosMessage já estiver aberto quando o projeto for enviado pelo site,
    // a nova solicitação entra no canal Vendas automaticamente.
    window.addEventListener("storage", function (event) {
        if (event.key !== PROJECT_NOTIFICATION_KEY) return;

        const changed = syncProjectsFromSite();

        if (changed) {
            renderSidebar();
            renderConversation();
        }
    });


    init();

</script>

</body>
</html>
