<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Área Administrativa | Projetos
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="admin-body">


    <!-- =====================================================
         CABEÇALHO
    ====================================================== -->

    <header class="admin-header">

        <div class="logo-image">
    <img src="logosdev_logo.jpg" alt="LOGOS DEV">
</div>



        <div class="admin-actions">

            <span>
                Área Administrativa
            </span>

            <a
                href="LogosMessage_integrado.html"
                class="back-admin"
                title="Abrir LogosMessage"
            >
                💬 Mensagens
            </a>

            <a
                href="index.html"
                class="back-admin"
            >
                ← Site
            </a>

        </div>

    </header>


    <!-- =====================================================
         CONTEÚDO
    ====================================================== -->

    <main class="admin-content">


        <div class="admin-title">

            <div>

                <span class="tag">
                    GESTÃO DE PROJETOS
                </span>

                <h1>
                    Projetos
                </h1>

                <p>
                    Gerencie todas as solicitações.
                </p>

            </div>


            <button
                type="button"
                class="refresh-btn"
                onclick="renderKanban()"
            >
                ↻ Atualizar
            </button>

        </div>


        <!-- =====================================================
             ESTATÍSTICAS
        ====================================================== -->

        <div class="stats">

            <div class="stat-card">

                <span>
                    Total
                </span>

                <strong id="totalProjetos">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    Solicitados
                </span>

                <strong id="totalSolicitados">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    Não iniciados
                </span>

                <strong id="totalNaoIniciados">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    Em andamento
                </span>

                <strong id="totalAndamento">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    Concluídos
                </span>

                <strong id="totalConcluidos">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    Rejeitados
                </span>

                <strong id="totalRejeitados">
                    0
                </strong>

            </div>

        </div>


        <!-- =====================================================
             KANBAN
        ====================================================== -->

        <div class="kanban">


            <!-- PROJETO SOLICITADO -->

            <div
                class="kanban-column solicitado"
            >

                <div class="column-header">

                    <h2>
                        Projeto Solicitado
                    </h2>

                    <span id="count-solicitado">
                        0
                    </span>

                </div>


                <div
                    class="drop-zone"
                    id="solicitado"
                    ondragover="allowDrop(event)"
                    ondrop="drop(event)"
                ></div>

            </div>


            <!-- NÃO INICIADO -->

            <div
                class="kanban-column nao-iniciado"
            >

                <div class="column-header">

                    <h2>
                        Não Iniciado
                    </h2>

                    <span id="count-nao-iniciado">
                        0
                    </span>

                </div>


                <div
                    class="drop-zone"
                    id="nao-iniciado"
                    ondragover="allowDrop(event)"
                    ondrop="drop(event)"
                ></div>

            </div>


            <!-- ANDAMENTO -->

            <div
                class="kanban-column andamento"
            >

                <div class="column-header">

                    <h2>
                        Em Andamento
                    </h2>

                    <span id="count-andamento">
                        0
                    </span>

                </div>


                <div
                    class="drop-zone"
                    id="andamento"
                    ondragover="allowDrop(event)"
                    ondrop="drop(event)"
                ></div>

            </div>


            <!-- CONCLUÍDO -->

            <div
                class="kanban-column concluido"
            >

                <div class="column-header">

                    <h2>
                        Concluído
                    </h2>

                    <span id="count-concluido">
                        0
                    </span>

                </div>


                <div
                    class="drop-zone"
                    id="concluido"
                    ondragover="allowDrop(event)"
                    ondrop="drop(event)"
                ></div>

            </div>


            <!-- REJEITADO -->

            <div
                class="kanban-column rejeitado"
            >

                <div class="column-header">

                    <h2>
                        Rejeitado
                    </h2>

                    <span id="count-rejeitado">
                        0
                    </span>

                </div>


                <div
                    class="drop-zone"
                    id="rejeitado"
                    ondragover="allowDrop(event)"
                    ondrop="drop(event)"
                ></div>

            </div>


        </div>

    </main>


    <!-- =====================================================
         MODAL DE EDIÇÃO
    ====================================================== -->

    <div
        id="projectModal"
        class="modal"
    >

        <div class="modal-box project-modal">


            <button
                type="button"
                class="close-modal"
                onclick="fecharProjeto()"
            >
                ×
            </button>


            <div class="modal-header">

                <span class="tag">
                    PROJETO
                </span>

                <h2>
                    Editar projeto
                </h2>

            </div>


            <form id="editProjectForm">


                <input
                    type="hidden"
                    id="editId"
                >


                <div class="form-row">

                    <div class="form-group">

                        <label>
                            Nome do projeto
                        </label>

                        <input
                            type="text"
                            id="editNome"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Tipo
                        </label>

                        <input
                            type="text"
                            id="editTipo"
                        >

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label>
                            Cliente
                        </label>

                        <input
                            type="text"
                            id="editCliente"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Empresa
                        </label>

                        <input
                            type="text"
                            id="editEmpresa"
                        >

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label>
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="editEmail"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Telefone
                        </label>

                        <input
                            type="text"
                            id="editTelefone"
                        >

                    </div>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label>
                            Data de início
                        </label>

                        <input
                            type="date"
                            id="editInicio"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Prazo
                        </label>

                        <input
                            type="date"
                            id="editPrazo"
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label>
                        GitHub
                    </label>

                    <input
                        type="url"
                        id="editGithub"
                        placeholder="https://github.com/..."
                    >

                </div>


                <div class="form-group">

                    <label>
                        Link do projeto
                    </label>

                    <input
                        type="url"
                        id="editLink"
                        placeholder="https://..."
                    >

                </div>


                <div class="form-group">

                    <label>
                        Status
                    </label>

                    <select id="editStatus">

                        <option value="solicitado">
                            Projeto Solicitado
                        </option>

                        <option value="nao-iniciado">
                            Não Iniciado
                        </option>

                        <option value="andamento">
                            Em Andamento
                        </option>

                        <option value="concluido">
                            Concluído
                        </option>

                        <option value="rejeitado">
                            Rejeitado
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Descrição
                    </label>

                    <textarea
                        id="editDescricao"
                        rows="6"
                    ></textarea>

                </div>


                <div class="form-group">

                    <label>
                        Observações administrativas
                    </label>

                    <textarea
                        id="editObservacoes"
                        rows="4"
                        placeholder="Anotações internas..."
                    ></textarea>

                </div>


                <div class="modal-buttons">


                    <button
                        type="button"
                        class="delete-btn"
                        onclick="excluirProjeto()"
                    >
                        Excluir
                    </button>


                    <div>

                        <button
                            type="button"
                            class="cancel-btn"
                            onclick="fecharProjeto()"
                        >
                            Cancelar
                        </button>


                        <button
                            type="submit"
                            class="btn"
                        >
                            Salvar alterações
                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>


    <script src="script.js"></script>

    <!-- =====================================================
         INTEGRAÇÃO: ADMIN -> LOGOSMESSAGE
         O index.html envia somente para o Admin (chave "projetos").
         Quando o Admin recebe a solicitação, ela é colocada na fila
         "logosdev_project_notifications" para o LogosMessage.
         O LogosMessage então publica no canal Vendas.
    ====================================================== -->
    <script>
        (function () {
            const PROJECTS_KEY = "projetos";
            const LOGOSMESSAGE_INBOX_KEY = "logosdev_project_notifications";
            const FORWARDED_KEY = "logosdev_project_forwarded_ids";

            function readArray(key) {
                try {
                    const value = JSON.parse(localStorage.getItem(key) || "[]");
                    return Array.isArray(value) ? value : [];
                } catch (e) {
                    return [];
                }
            }

            function saveArray(key, value) {
                localStorage.setItem(key, JSON.stringify(value));
            }

            function getProjectId(project) {
                if (!project) return null;
                return project.id || project.projectId || project.codigo || project.createdAt || null;
            }

            function encaminharProjetosParaLogosMessage(projectList) {
                if (!Array.isArray(projectList) || !projectList.length) return;

                const fila = readArray(LOGOSMESSAGE_INBOX_KEY);
                const encaminhados = readArray(FORWARDED_KEY);
                const encaminhadosSet = new Set(encaminhados.map(String));
                let filaAlterada = false;
                let idsAlterados = false;

                projectList.forEach(function (project) {
                    const projectId = getProjectId(project);
                    if (!projectId) return;

                    const id = String(projectId);

                    // Não encaminha novamente o mesmo projeto.
                    if (encaminhadosSet.has(id)) return;

                    // Também evita duplicar caso ele já esteja aguardando no Inbox.
                    const alreadyQueued = fila.some(function (item) {
                        return item && String(item.id || item.projectId || item.codigo || "") === id;
                    });

                    if (!alreadyQueued) {
                        fila.push({
                            ...project,
                            id: project.id || id,
                            origem: project.origem || "admin.html",
                            enviadoPeloAdminEm: Date.now()
                        });
                        filaAlterada = true;
                    }

                    encaminhados.push(id);
                    encaminhadosSet.add(id);
                    idsAlterados = true;
                });

                if (filaAlterada) {
                    saveArray(LOGOSMESSAGE_INBOX_KEY, fila);
                }

                if (idsAlterados) {
                    // Mantém somente os últimos 1000 IDs para não crescer indefinidamente.
                    saveArray(FORWARDED_KEY, encaminhados.slice(-1000));
                }
            }

            function sincronizarDoStorage(projetosJSON) {
                try {
                    const lista = JSON.parse(projetosJSON || "[]");
                    if (Array.isArray(lista)) {
                        encaminharProjetosParaLogosMessage(lista);
                    }
                } catch (e) {
                    console.error("Erro ao encaminhar projetos para o LogosMessage:", e);
                }
            }

            // Quando uma nova solicitação chega do index.html.
            window.addEventListener("storage", function (event) {
                if (event.key !== PROJECTS_KEY) return;

                sincronizarDoStorage(event.newValue);

                try {
                    if (typeof projetos !== "undefined") {
                        projetos = JSON.parse(event.newValue || "[]");
                    }
                    if (typeof renderizar === "function") {
                        renderizar();
                    }
                } catch (e) {
                    window.location.reload();
                }
            });

            // Se o Admin for aberto depois que o cliente já enviou o projeto,
            // também faz o encaminhamento.
            window.addEventListener("load", function () {
                sincronizarDoStorage(localStorage.getItem(PROJECTS_KEY));
            });
        })();
    </script>

</body>

</html>
